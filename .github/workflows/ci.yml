name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck stow vim

      - name: Validate Bash syntax
        run: |
          bash -n install.sh
          bash -n bash/.bashrc
          bash -n vscode/install-extensions.sh

      - name: Run ShellCheck
        run: |
          shellcheck install.sh
          shellcheck bash/.bashrc
          shellcheck vscode/install-extensions.sh

      - name: Validate Git configuration
        run: |
          git config --file git/.gitconfig --list >/dev/null
          test "$(git config --file git/.gitconfig --get init.defaultBranch)" = "main"
          test "$(git config --file git/.gitconfig --get pull.rebase)" = "true"
          git config --file git/.gitconfig --get alias.lg >/dev/null

      - name: Validate Vim configuration
        run: vim -Nu vim/.vimrc -n -es +'qa!'

      - name: Validate VS Code settings
        run: python3 -m json.tool vscode/settings.json >/dev/null

      - name: Verify no-argument behavior
        shell: bash
        run: |
          set +e
          output="$(./install.sh 2>&1)"
          status=$?
          set -e

          test "$status" -eq 64
          grep -q '^Usage:' <<< "$output"

      - name: Reject unmanaged packages
        shell: bash
        run: |
          set +e
          output="$(./install.sh vscode 2>&1)"
          status=$?
          set -e

          test "$status" -eq 66
          grep -q 'unmanaged or invalid package' <<< "$output"

      - name: Verify all Stow packages
        shell: bash
        run: |
          export HOME="$(mktemp -d)"
          ./install.sh --all

          test -L "$HOME/.gitconfig"
          test -L "$HOME/.bashrc"
          test -L "$HOME/.inputrc"
          test -L "$HOME/.vimrc"

          test "$(git config --file "$HOME/.gitconfig" --get init.defaultBranch)" = "main"
          test "$(git config --file "$HOME/.gitconfig" --get pull.rebase)" = "true"

      - name: Verify Bash defaults
        shell: bash
        run: |
          export HOME="$(mktemp -d)"
          stow --dir="$GITHUB_WORKSPACE" --target="$HOME" bash readline
          bash --noprofile --rcfile "$HOME/.bashrc" -ic '
            test "$HISTSIZE" = "10000"
            test "$HISTFILESIZE" = "10000"
            [[ "$HISTCONTROL" == *erasedups* ]]
          '
