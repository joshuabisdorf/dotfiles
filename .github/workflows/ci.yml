name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck stow vim

      - name: Validate Bash syntax
        run: |
          bash -n install.sh
          bash -n setup.sh
          bash -n bash/.bashrc
          bash -n vscode/install-settings.sh
          bash -n vscode/install-extensions.sh

      - name: Run ShellCheck
        run: |
          shellcheck install.sh
          shellcheck setup.sh
          shellcheck bash/.bashrc
          shellcheck vscode/install-settings.sh
          shellcheck vscode/install-extensions.sh

      - name: Validate Git configuration
        run: |
          git config --file git/.gitconfig --list >/dev/null
          test "$(git config --file git/.gitconfig --get init.defaultBranch)" = "main"
          test "$(git config --file git/.gitconfig --get pull.rebase)" = "true"
          test "$(git config --file git/.gitconfig --get fetch.prune)" = "true"
          test "$(git config --file git/.gitconfig --get push.autoSetupRemote)" = "true"
          git config --file git/.gitconfig --get alias.lg >/dev/null

      - name: Validate Vim configuration
        run: |
          vim -Nu vim/.vimrc -n -es +'qa!'
          grep -q '^set expandtab$' vim/.vimrc
          grep -q '^set tabstop=2$' vim/.vimrc
          grep -q '^set shiftwidth=2$' vim/.vimrc
          grep -q '^set softtabstop=2$' vim/.vimrc

      - name: Validate JSON settings
        run: |
          python3 -m json.tool vscode/settings.json >/dev/null
          python3 -m json.tool windows-terminal/settings.json >/dev/null

      - name: Verify no-argument behavior
        shell: bash
        run: |
          set +e
          output="$(./install.sh 2>&1)"
          status=$?
          set -e

          test "$status" -eq 64
          grep -q '^Usage:' <<< "$output"

      - name: Reject unmanaged packages
        shell: bash
        run: |
          set +e
          output="$(./install.sh vscode 2>&1)"
          status=$?
          set -e

          test "$status" -eq 66
          grep -q 'unmanaged or invalid package' <<< "$output"

      - name: Verify Stow dry run
        shell: bash
        run: |
          export HOME="$(mktemp -d)"
          ./install.sh --dry-run --all

          test ! -e "$HOME/.gitconfig"
          test ! -e "$HOME/.bashrc"
          test ! -e "$HOME/.inputrc"
          test ! -e "$HOME/.vimrc"

      - name: Verify Stow install and uninstall
        shell: bash
        run: |
          export HOME="$(mktemp -d)"
          ./install.sh --all

          test -L "$HOME/.gitconfig"
          test -L "$HOME/.bashrc"
          test -L "$HOME/.inputrc"
          test -L "$HOME/.vimrc"

          test "$(git config --file "$HOME/.gitconfig" --get init.defaultBranch)" = "main"
          test "$(git config --file "$HOME/.gitconfig" --get pull.rebase)" = "true"
          test "$(git config --file "$HOME/.gitconfig" --get fetch.prune)" = "true"
          test "$(git config --file "$HOME/.gitconfig" --get push.autoSetupRemote)" = "true"

          ./install.sh --uninstall --all

          test ! -e "$HOME/.gitconfig"
          test ! -e "$HOME/.bashrc"
          test ! -e "$HOME/.inputrc"
          test ! -e "$HOME/.vimrc"

      - name: Verify Bash defaults
        shell: bash
        run: |
          export HOME="$(mktemp -d)"
          stow --dir="$GITHUB_WORKSPACE" --target="$HOME" bash readline
          bash --noprofile --rcfile "$HOME/.bashrc" -ic '
            test "$HISTSIZE" = "10000"
            test "$HISTFILESIZE" = "10000"
            [[ "$HISTCONTROL" == *erasedups* ]]
          '

      - name: Verify top-level dry run
        shell: bash
        run: |
          export HOME="$(mktemp -d)"
          export XDG_CONFIG_HOME="$HOME/.config"
          ./setup.sh --dry-run

          test ! -e "$HOME/.gitconfig"
          test ! -e "$XDG_CONFIG_HOME/Code/User/settings.json"

  windows:
    name: Windows validation
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null

            if ($parseErrors.Count -gt 0) {
              throw "$($_.FullName): $($parseErrors -join '; ')"
            }
          }

      - name: Validate JSON settings
        shell: pwsh
        run: |
          Get-Content -Raw vscode/settings.json | ConvertFrom-Json | Out-Null
          Get-Content -Raw windows-terminal/settings.json | ConvertFrom-Json | Out-Null

      - name: Verify Windows top-level dry run
        shell: pwsh
        run: .\setup.ps1 -DryRun
