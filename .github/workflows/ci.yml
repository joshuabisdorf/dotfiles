name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck stow vim

      - name: Validate Bash syntax
        run: |
          bash -n setup-linux.sh
          bash -n bash/.bashrc

      - name: Run ShellCheck
        run: |
          shellcheck setup-linux.sh
          shellcheck bash/.bashrc

      - name: Validate Git configuration
        run: |
          git config --file git/.gitconfig --list >/dev/null
          test "$(git config --file git/.gitconfig --get init.defaultBranch)" = "main"
          test "$(git config --file git/.gitconfig --get pull.rebase)" = "true"
          test "$(git config --file git/.gitconfig --get fetch.prune)" = "true"
          test "$(git config --file git/.gitconfig --get push.autoSetupRemote)" = "true"
          git config --file git/.gitconfig --get alias.lg >/dev/null

      - name: Validate Vim configuration
        run: |
          vim -Nu vim/.vimrc -n -es +'qa!'
          grep -q '^set expandtab$' vim/.vimrc
          grep -q '^set tabstop=2$' vim/.vimrc
          grep -q '^set shiftwidth=2$' vim/.vimrc
          grep -q '^set softtabstop=2$' vim/.vimrc

      - name: Validate JSON settings
        run: |
          python3 -m json.tool vscode/settings.json >/dev/null
          python3 -m json.tool windows-terminal/settings.json >/dev/null

      - name: Verify Linux setup interface
        shell: bash
        run: |
          output="$(./setup-linux.sh list)"
          grep -q '^git ' <<< "$output"
          grep -q '^bash ' <<< "$output"
          grep -q '^readline ' <<< "$output"
          grep -q '^vim ' <<< "$output"
          grep -q '^vscode ' <<< "$output"
          ! grep -q '^powershell ' <<< "$output"
          ! grep -q '^all ' <<< "$output"

          set +e
          output="$(./setup-linux.sh install not-a-component --dry-run 2>&1)"
          status=$?
          set -e

          test "$status" -eq 66
          grep -q 'unknown component' <<< "$output"

      - name: Verify all-components dry run
        shell: bash
        run: |
          export HOME="$(mktemp -d)"
          export XDG_CONFIG_HOME="$HOME/.config"

          ./setup-linux.sh install --all --dry-run

          test ! -e "$HOME/.gitconfig"
          test ! -e "$HOME/.bashrc"
          test ! -e "$HOME/.inputrc"
          test ! -e "$HOME/.vimrc"
          test ! -e "$XDG_CONFIG_HOME/Code/User/settings.json"

      - name: Verify Stow install reinstall and uninstall
        shell: bash
        run: |
          export HOME="$(mktemp -d)"

          ./setup-linux.sh install git bash readline vim

          test -L "$HOME/.gitconfig"
          test -L "$HOME/.bashrc"
          test -L "$HOME/.inputrc"
          test -L "$HOME/.vimrc"

          test "$(git config --file "$HOME/.gitconfig" --get init.defaultBranch)" = "main"
          test "$(git config --file "$HOME/.gitconfig" --get pull.rebase)" = "true"
          test "$(git config --file "$HOME/.gitconfig" --get fetch.prune)" = "true"
          test "$(git config --file "$HOME/.gitconfig" --get push.autoSetupRemote)" = "true"

          ./setup-linux.sh reinstall git bash readline vim

          test -L "$HOME/.gitconfig"
          test -L "$HOME/.bashrc"
          test -L "$HOME/.inputrc"
          test -L "$HOME/.vimrc"

          ./setup-linux.sh uninstall git bash readline vim

          test ! -e "$HOME/.gitconfig"
          test ! -e "$HOME/.bashrc"
          test ! -e "$HOME/.inputrc"
          test ! -e "$HOME/.vimrc"

      - name: Verify Bash defaults
        shell: bash
        run: |
          export HOME="$(mktemp -d)"
          stow --dir="$GITHUB_WORKSPACE" --target="$HOME" bash readline
          bash --noprofile --rcfile "$HOME/.bashrc" -ic '
            test "$HISTSIZE" = "10000"
            test "$HISTFILESIZE" = "10000"
            [[ "$HISTCONTROL" == *erasedups* ]]
          '

      - name: Verify obsolete setup scripts are absent
        run: |
          test ! -e setup.sh
          test ! -e setup.ps1
          test ! -e install.sh
          test ! -e stow-packages.txt
          test ! -e vscode/install-settings.sh
          test ! -e vscode/install-settings.ps1
          test ! -e vscode/install-extensions.sh
          test ! -e vscode/install-extensions.ps1
          test ! -e powershell/install.ps1
          test ! -e windows-terminal/install.ps1

  windows:
    name: Windows validation
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null

            if ($parseErrors.Count -gt 0) {
              throw "$($_.FullName): $($parseErrors -join '; ')"
            }
          }

      - name: Verify PowerShell profile defaults
        shell: pwsh
        run: |
          . ./powershell/profile.ps1

          if ($PSStyle.FileInfo.Directory -ne $PSStyle.Foreground.BrightBlue) {
            throw "PowerShell directories must be bright blue."
          }
          if ($PSStyle.FileInfo.Executable -ne $PSStyle.Foreground.BrightGreen) {
            throw "PowerShell executables must be bright green."
          }
          if ($PSStyle.FileInfo.SymbolicLink -ne $PSStyle.Foreground.Cyan) {
            throw "PowerShell symbolic links must be cyan."
          }
          if ($PSStyle.FileInfo.Extension[".json"] -ne $PSStyle.Foreground.Yellow) {
            throw "JSON files must be yellow."
          }
          if ($PSStyle.FileInfo.Extension[".zip"] -ne $PSStyle.Foreground.Red) {
            throw "Archives must be red."
          }

          $readLine = Get-PSReadLineOption
          if (-not $readLine.StringColor) {
            throw "PSReadLine string color must be configured."
          }
          if (-not $readLine.VariableColor) {
            throw "PSReadLine variable color must be configured."
          }

          $tabHandler = @(
            Get-PSReadLineKeyHandler -Bound |
              Where-Object { $_.Key -eq "Tab" }
          )

          if ($tabHandler.Count -ne 1 -or $tabHandler[0].Function -ne "Complete") {
            throw "Tab must use Bash-like Complete behavior."
          }

          Push-Location $HOME
          try {
            $promptText = prompt
          }
          finally {
            Pop-Location
          }

          $identity = "$([Environment]::UserName)@$([Environment]::MachineName)"
          if ($promptText -notlike "*$identity*") {
            throw "PowerShell prompt must include user@host."
          }
          if ($promptText -notlike "*~*") {
            throw "PowerShell prompt must shorten HOME to ~."
          }
          if (-not $promptText.EndsWith(" > ")) {
            throw "PowerShell prompt must end with >."
          }

      - name: Validate JSON settings
        shell: pwsh
        run: |
          Get-Content -Raw vscode/settings.json | ConvertFrom-Json | Out-Null

          $terminal = Get-Content -Raw windows-terminal/settings.json | ConvertFrom-Json
          $powerShellGuid = "{574e775e-4f2a-5b96-ac1e-a2962a402336}"

          if ($terminal.defaultProfile -ne $powerShellGuid) {
            throw "Windows Terminal default profile must be the PowerShell 7 profile GUID."
          }

          $powerShellProfile = @(
            $terminal.profiles.list |
              Where-Object { $_.guid -eq $powerShellGuid }
          )

          if ($powerShellProfile.Count -ne 1) {
            throw "Windows Terminal must define exactly one PowerShell 7 profile."
          }
          if ($powerShellProfile[0].hidden -ne $false) {
            throw "Windows Terminal PowerShell 7 profile must be visible."
          }
          if ($powerShellProfile[0].source -ne "Windows.Terminal.PowershellCore") {
            throw "Windows Terminal PowerShell 7 profile must use the PowerShell Core dynamic source."
          }
          if ($terminal.profiles.defaults.font.face -ne "Cascadia Mono") {
            throw "Windows Terminal font must be Cascadia Mono."
          }
          if ([int]$terminal.profiles.defaults.font.size -ne 12) {
            throw "Windows Terminal font size must be 12."
          }
          if ($terminal.profiles.defaults.colorScheme -ne "Campbell") {
            throw "Windows Terminal color scheme must be Campbell."
          }
          if ($terminal.profiles.defaults.cursorShape -ne "filledBox") {
            throw "Windows Terminal cursor must be a filled box."
          }
          if ([int]$terminal.profiles.defaults.opacity -ne 100) {
            throw "Windows Terminal must be fully opaque."
          }
          if ($terminal.profiles.defaults.useAcrylic -ne $false) {
            throw "Windows Terminal acrylic must be disabled."
          }
          if ($terminal.profiles.defaults.padding -ne "8") {
            throw "Windows Terminal padding must be 8."
          }
          if ($terminal.profiles.defaults.PSObject.Properties.Name -contains "startingDirectory") {
            throw "Windows Terminal must not globally override startingDirectory."
          }

      - name: Verify Windows setup interface
        shell: pwsh
        run: |
          $output = .\setup-windows.ps1 list | Out-String
          if ($output -notmatch "(?m)^git\s") { throw "git component missing" }
          if ($output -notmatch "(?m)^powershell\s") { throw "powershell component missing" }
          if ($output -notmatch "(?m)^vscode\s") { throw "vscode component missing" }
          if ($output -notmatch "(?m)^terminal\s") { throw "terminal component missing" }
          if ($output -match "(?m)^all\s") { throw "all must be a selector flag, not a component" }

      - name: Verify Windows all-components dry run
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP "dotfiles-appdata"
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "dotfiles-localappdata"
          New-Item -ItemType Directory -Path $env:APPDATA -Force | Out-Null
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA -Force | Out-Null

          .\setup-windows.ps1 install -All -DryRun

          if (Test-Path (Join-Path $env:APPDATA "Code\User\settings.json")) {
            throw "VS Code settings changed during dry run."
          }
          if (Test-Path (Join-Path $env:LOCALAPPDATA "Packages\Microsoft.WindowsTerminal_8wekyb3d8bbwe\LocalState\settings.json")) {
            throw "Windows Terminal settings changed during dry run."
          }

      - name: Verify obsolete setup scripts are absent
        shell: pwsh
        run: |
          $obsolete = @(
            "setup.sh",
            "setup.ps1",
            "install.sh",
            "stow-packages.txt",
            "vscode/install-settings.sh",
            "vscode/install-settings.ps1",
            "vscode/install-extensions.sh",
            "vscode/install-extensions.ps1",
            "powershell/install.ps1",
            "windows-terminal/install.ps1"
          )

          foreach ($path in $obsolete) {
            if (Test-Path -LiteralPath $path) {
              throw "Obsolete setup entry point still exists: $path"
            }
          }
